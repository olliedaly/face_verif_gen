defaults:
  - data: casia
  - model: iresnet18
  - head: arcface
  - train: default
  - eval: default
  - _self_

seed: 0
allow_dirty: false
resume: false   # carry on from out_dir's checkpoint.pt, where a stopped run left off
out_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}   # checkpoint and results; Hydra's log too
hydra:
  run:
    dir: ${out_dir}
wandb:
  project: unreadable-cluster
  mode: online   # tests and CI override this to disabled
