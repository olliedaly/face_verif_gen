[project]
name = "face-verif-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ollie Daly", email = "olliedaly1995@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "wandb>=0.31.0",
]

[project.scripts]
face-verif-gen = "face_verif_gen:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/reference"]   # other people's code, kept as they wrote it

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, import order, bugbear, modern syntax

[tool.ruff.lint.isort]
# W&B's local run folder, wandb/, otherwise makes ruff sort wandb as one of our own modules.
known-third-party = ["wandb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (skipped in CI)"]
